<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Базовый английский гардероб Ксюши · LIFT your English</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:#f1f5f9;color:#1e293b;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
.wrap{width:100%;max-width:576px}
header{text-align:center;margin:16px auto}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(90deg,#ec4899,#6366f1);color:#fff;padding:4px 12px;border-radius:999px}
h1{font-size:28px;font-weight:800;color:#0f172a;margin:8px 0 4px}
.sub{font-size:14px;color:#64748b;font-weight:500;margin:0}
.mode{margin-top:16px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:8px 16px;font-size:14px;font-weight:600;color:#334155;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mode b{color:#4f46e5}
.voice{margin-top:12px;font-size:12px;color:#64748b;display:flex;gap:8px;justify-content:center;align-items:center}
.voice select{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:4px 8px;max-width:240px;font-size:12px}
main{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.bar{width:100%;height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}
#progressBar{height:8px;background:linear-gradient(90deg,#6366f1,#ec4899);transition:width .5s;width:0}
.perspective{perspective:1000px;width:100%;height:288px}
#cardInner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s;background:#fff;border-radius:16px;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);border:1px solid #e2e8f0}
.rotate-y-180{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{background:#fff;border:2px solid #e2e8f0}
.back.ok{background:#ecfdf5;border-color:#6ee7b7;color:#065f46}
.back.bad{background:#fff1f2;border-color:#fda4af;color:#9f1239}
.badge{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:4px 12px;border-radius:999px;margin-bottom:12px;border:1px solid #e2e8f0;background:#f1f5f9}
.badge.sky{background:#e0f2fe;color:#075985;border-color:#bae6fd}
.badge.blue{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
.badge.emerald{background:#d1fae5;color:#065f46;border-color:#a7f3d0}
.badge.teal{background:#ccfbf1;color:#115e59;border-color:#99f6e4}
.badge.purple{background:#f3e8ff;color:#6b21a8;border-color:#e9d5ff}
#verbTarget{font-size:18px;font-weight:500;color:#94a3b8;margin:0 0 4px}
#cardQuestion{font-size:20px;font-weight:700;color:#0f172a;line-height:1.35;margin:0;padding:0 8px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.6);margin-bottom:8px}
.ans{display:flex;align-items:center;justify-content:center;gap:12px}
#cardAnswer{font-size:18px;font-weight:700;color:#312e81;background:rgba(255,255,255,.7);padding:8px 12px;border-radius:8px}
.spk{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:8px;font-size:16px;cursor:pointer}
#cardHint{font-size:12px;color:#475569;margin:16px 0 0;font-style:italic;max-width:360px}
#inputZone{width:100%;display:flex;flex-direction:column;gap:12px}
.field{position:relative;width:100%}
#studentInput{width:100%;padding:16px 130px 16px 16px;border:2px solid #e2e8f0;border-radius:12px;font-size:18px;font-weight:500;outline:none;background:#fff;color:#1e293b}
#studentInput:focus{border-color:#6366f1}
.check{position:absolute;right:8px;top:8px;bottom:8px;background:#4f46e5;color:#fff;border:0;border-radius:8px;padding:0 20px;font-weight:700;font-size:14px;cursor:pointer}
.link{align-self:flex-end;background:none;border:0;font-size:12px;color:#94a3b8;text-decoration:underline;cursor:pointer}
.controls{width:100%;gap:8px}
.controls button{flex:1;border:0;border-radius:12px;padding:12px 8px;color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.no{background:#f43f5e}.yes{background:#10b981}
.hidden{display:none!important}
.flex{display:flex}
a.brand{color:inherit;text-decoration:none}
.brandtop{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#4f46e5;margin-bottom:10px}
.brandfoot{text-align:center;font-size:12px;color:#64748b;margin:0 auto 8px}
.brandfoot a{color:#4f46e5;font-weight:700;text-decoration:none}
footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#94a3b8;font-weight:500;margin:16px auto}
footer button{background:none;border:0;color:#94a3b8;text-decoration:underline;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap"><header>
<div class="brandtop">LIFT your English</div>
<span class="tag">Интерактивный учебник</span>
<h1>Базовый английский гардероб Ксюши</h1>
<p class="sub">Daily Verbs &amp; Advanced Tenses с авто-озвучкой</p>
<button class="mode" onclick="toggleDirection()">Режим перевода: <b id="directionLabel">🇷🇺 → 🇬🇧 (с русского на английский)</b></button>
<div class="voice"><span>Голос:</span><select id="voiceSelect" onchange="setVoice(this.value)"></select></div>
</header></div>

<noscript><p style="text-align:center;color:#9f1239">В этом режиме просмотра скрипты отключены. Откройте файл в Chrome или Safari.</p></noscript>
<main class="wrap">
<div class="bar"><div id="progressBar"></div></div>
<div class="perspective"><div id="cardInner">
<div class="face">
<span id="tenseBadge" class="badge">Время</span>
<p id="verbTarget">Глагол: …</p>
<p id="cardQuestion">Загрузка…</p>
</div>
<div id="cardBack" class="face back rotate-y-180">
<span class="lbl">Правильный ответ</span>
<div class="ans"><div id="cardAnswer">Answer</div><button class="spk" onclick="speakAnswer()" title="Прослушать">🔊</button></div>
<p id="cardHint"></p>
</div>
</div></div>

<div id="inputZone">
<div class="field"><input type="text" id="studentInput" autocomplete="off" placeholder="Введите перевод всей ситуации…"><button class="check" onclick="checkAnswer()">Проверить</button></div>
<button class="link" onclick="showAnswer(false)">Не помню / Показать ответ</button>
</div>
<div id="controls" class="controls hidden">
<button class="no" onclick="rateCard(1)">❌ Ошибка / Повторить</button>
<button class="yes" onclick="rateCard(5)">✅ Всё правильно</button>
</div>
</main>

<footer class="wrap"><span id="statsText">Изучено ситуаций: 0 / 0</span><button onclick="resetProgress()">Сбросить прогресс</button></footer>
<div class="wrap brandfoot">Проект Татьяны Яфясовой · <a href="https://t.me/LIFTyourEnglish" target="_blank" rel="noopener">LIFT your English</a> · английский по логике, а не по зубрёжке</div>

<script>
window.onerror=function(m,u,l){var q=document.getElementById('cardQuestion');if(q)q.textContent='Ошибка: '+m+' (строка '+l+')';};
let currentDirection='ru-en', userProgress={}, currentCard=null;
const cardsData=[
{id:1,verb:"work on the phone",tense:"Present Progressive",ru:"Не отвлекай меня, я сейчас работаю в телефоне.",en:"Don’t distract me, I am working on the phone right now.",hint:"Present Progressive. Действие происходит прямо сейчас: am + V-ing."},
{id:2,verb:"work on the phone",tense:"Past Progressive",ru:"Когда ты зашёл, я работала в телефоне.",en:"When you came in, I was working on the phone.",hint:"Past Progressive. Процесс в прошлом: was/were + V-ing."},
{id:3,verb:"work on the phone",tense:"Present Perfect Continuous",ru:"Я сижу (работаю) в телефоне уже два часа.",en:"I have been working on the phone for two hours.",hint:"Present Perfect Continuous. Началось в прошлом и длится до сих пор: have been + V-ing."},
{id:4,verb:"hold meetings",tense:"Present Progressive",ru:"Я сейчас провожу важный митинг.",en:"I am holding an important meeting right now.",hint:"Present Progressive. Прямо сейчас: am holding."},
{id:5,verb:"hold meetings",tense:"Present Perfect",ru:"Сегодня я уже провела три митинга.",en:"I have already held three meetings today.",hint:"Present Perfect. Связь с настоящим (результат): have + held (3-я форма)."},
{id:6,verb:"hold meetings",tense:"Present Perfect Continuous",ru:"Я провожу этот митинг уже с двух часов дня.",en:"I have been holding this meeting since 2 p.m.",hint:"Present Perfect Continuous: have been holding."},
{id:7,verb:"have breakfast",tense:"Present Progressive",ru:"Подожди минуту, я сейчас завтракаю.",en:"Wait a minute, I am having breakfast right now.",hint:"Present Progressive. В выражениях приёма пищи have принимает форму -ing."},
{id:8,verb:"have lunch",tense:"Present Perfect",ru:"Я уже пообедала, так что можем созваниваться.",en:"I have already had lunch, so we can make a call.",hint:"Present Perfect. have (вспомогательный) + had (3-я форма)."},
{id:9,verb:"have dinner",tense:"Past Progressive",ru:"Мы ужинали, когда выключили свет.",en:"We were having dinner when the lights went out.",hint:"Past Progressive. Длительное фоновое действие в прошлом."},
{id:10,verb:"have breakfast",tense:"Present Perfect Continuous",ru:"Я завтракаю уже полчаса, потому что смотрю сериал.",en:"I have been having breakfast for half an hour because I am watching a TV series.",hint:"Present Perfect Continuous."},
{id:11,verb:"brush teeth",tense:"Present Progressive",ru:"Он не может подойти, он сейчас чистит зубы.",en:"He can’t come to the phone, he is brushing his teeth right now.",hint:"Present Progressive для he: is + V-ing."},
{id:12,verb:"brush teeth",tense:"Present Perfect",ru:"Я уже почистила зубы, я готова ложиться спать.",en:"I have already brushed my teeth, I am ready to go to bed.",hint:"Present Perfect. Действие завершено, важен результат. Brush — правильный глагол (+ed)."},
{id:13,verb:"brush teeth",tense:"Past Progressive",ru:"Я чистила зубы, когда зазвонил телефон.",en:"I was brushing my teeth when the phone rang.",hint:"Past Progressive."},
{id:14,verb:"do hair",tense:"Present Progressive",ru:"Я сейчас укладываю волосы, буду готова через 10 минут.",en:"I am doing my hair right now, I will be ready in 10 minutes.",hint:"Укладывать волосы — do one’s hair."},
{id:15,verb:"do hair",tense:"Present Perfect",ru:"Она уже уложила волосы, мы можем выходить.",en:"She has already done her hair, we can go out.",hint:"Present Perfect. Для she нужен has. Третья форма do — done."},
{id:16,verb:"do hair",tense:"Present Perfect Continuous",ru:"Я укладываю волосы уже целый час, это так сложно!",en:"I have been doing my hair for a whole hour, it is so difficult!",hint:"Present Perfect Continuous."},
{id:17,verb:"go to the cinema",tense:"Present Perfect",ru:"Мы не ходили в кино в этом месяце.",en:"We haven’t gone to the cinema this month.",hint:"Present Perfect в отрицании. Период (this month) ещё не закончился. Третья форма go — gone."},
{id:18,verb:"go to exhibitions",tense:"Present Perfect Continuous",ru:"Я хожу на выставки с самого детства.",en:"I have been going to exhibitions since my childhood.",hint:"Present Perfect Continuous. Точка старта в прошлом (since)."},
{id:19,verb:"go to the cinema",tense:"Past Progressive",ru:"Вчера в это время мы шли в кино.",en:"Yesterday at this time we were going to the cinema.",hint:"Past Progressive. Точный момент времени в прошлом."},
{id:20,verb:"go to exhibitions",tense:"Past Perfect",ru:"Я сходила на три выставки до того, как они закрылись.",en:"I had gone to three exhibitions before they closed.",hint:"Past Perfect: had + gone."},
{id:21,verb:"refuel the car",tense:"Present Progressive",ru:"Подожди в машине, я сейчас её заправляю.",en:"Wait in the car, I am refueling the car right now.",hint:"Present Progressive. Заправлять топливом — refuel."},
{id:22,verb:"refuel the car",tense:"Present Perfect",ru:"Я уже заправила машину, можем ехать далеко.",en:"I have already refueled the car, we can drive far.",hint:"Present Perfect. Бак полон прямо сейчас."},
{id:23,verb:"refuel the car",tense:"Present Perfect Continuous",ru:"Я пытаюсь заправить машину на этой станции уже 15 минут.",en:"I have been trying to refuel the car at this station for 15 minutes.",hint:"Present Perfect Continuous."},
{id:24,verb:"wash the car",tense:"Present Progressive",ru:"Я сейчас мою машину на мойке самообслуживания.",en:"I am washing the car at the self-service car wash right now.",hint:"Present Progressive. В процессе мытья."},
{id:25,verb:"wash the car",tense:"Past Progressive",ru:"Я мыла машину, когда начался дождь.",en:"I was washing the car when it started to rain.",hint:"Past Progressive."},
{id:26,verb:"wash the car",tense:"Present Perfect",ru:"Я наконец-то помыла машину, она блестит.",en:"I have finally washed the car, it shines.",hint:"Present Perfect. Важен результат."},
{id:27,verb:"wash the car",tense:"Past Perfect",ru:"Я помыла машину до того, как пошёл сильный ливень.",en:"I had washed the car before the heavy rain started.",hint:"Past Perfect: had washed."},
{id:28,verb:"take a nap",tense:"Present Progressive",ru:"Тише, она сейчас спит (прикорнула).",en:"Quiet, she is taking a nap right now.",hint:"Present Progressive: is taking a nap."},
{id:29,verb:"take a nap",tense:"Present Perfect",ru:"Я только что вздремнул и чувствую себя отлично.",en:"I have just taken a nap and feel great.",hint:"Present Perfect с маркером just: have taken."},
{id:30,verb:"text",tense:"Past Progressive",ru:"Я писала сообщение за рулём, когда увидела полицию.",en:"I was texting while driving when I saw the police.",hint:"Past Progressive: was texting."},
{id:31,verb:"text",tense:"Present Perfect Continuous",ru:"Я пишу сообщения клиентам всё утро.",en:"I have been texting clients all morning.",hint:"Present Perfect Continuous: have been texting."},
{id:32,verb:"take a nap",tense:"Present Perfect Continuous",ru:"Я сплю (прикорнул) уже целый час, разбуди меня.",en:"I have been taking a nap for a whole hour, wake me up.",hint:"Present Perfect Continuous."},
{id:33,verb:"hold meetings",tense:"Past Progressive",ru:"Я проводила митинг, когда у меня отключился интернет.",en:"I was holding a meeting when my internet disconnected.",hint:"Past Progressive: was holding."},
{id:34,verb:"hold meetings",tense:"Past Perfect",ru:"Я провела все митинги до 5 вечера.",en:"I had held all the meetings by 5 p.m.",hint:"Past Perfect: had held."},
{id:35,verb:"work on the phone",tense:"Past Perfect",ru:"Я уже поработала в телефоне до того, как ты позвонил.",en:"I had already worked on the phone before you called.",hint:"Past Perfect: had worked."}
];
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('wardrobe_progress',JSON.stringify(userProgress))}catch(e){}}
function freshProgress(){userProgress={};cardsData.forEach(c=>{userProgress[c.id]={weight:5}})}
function init(){
 freshProgress();
 try{const s=localStorage.getItem('wardrobe_progress');if(s){const p=JSON.parse(s);cardsData.forEach(c=>{if(p[c.id]&&typeof p[c.id].weight==='number')userProgress[c.id]=p[c.id]})}}catch(e){}
 $('studentInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});
 pickNextCard();updateStats();
}
function toggleDirection(){
 currentDirection=currentDirection==='ru-en'?'en-ru':'ru-en';
 const ru=currentDirection==='ru-en';
 $('directionLabel').innerText=ru?'🇷🇺 → 🇬🇧 (с русского на английский)':'🇬🇧 → 🇷🇺 (с английского на русский)';
 $('studentInput').placeholder=ru?'Введите перевод всей ситуации…':'Введите русский перевод…';
 pickNextCard();
}
function pickNextCard(){
 $('cardInner').classList.remove('rotate-y-180');
 $('inputZone').classList.remove('hidden');
 $('controls').classList.add('hidden');$('controls').classList.remove('flex');
 $('studentInput').value='';$('studentInput').focus();
 const pool=[];
 cardsData.forEach(c=>{const w=userProgress[c.id]?userProgress[c.id].weight:5;for(let i=0;i<w;i++)pool.push(c)});
 let picked=pool[Math.floor(Math.random()*pool.length)];
 if(currentCard&&picked.id===currentCard.id){picked=pool.find(c=>c.id!==currentCard.id)||picked}
 currentCard=picked;renderCard(picked);
}
const tenseStyles={
 "Present Progressive":"sky",
 "Past Progressive":"blue",
 "Present Perfect":"emerald",
 "Present Perfect Continuous":"teal",
 "Past Perfect":"purple"};
function renderCard(c){
 const b=$('tenseBadge');b.innerText=c.tense;
 b.className='badge '+(tenseStyles[c.tense]||'');
 $('verbTarget').innerText='Глагол: '+c.verb;
 const ru=currentDirection==='ru-en';
 $('cardQuestion').innerText=ru?c.ru:c.en;
 $('cardAnswer').innerText=ru?c.en:c.ru;
 $('cardHint').innerText=c.hint;
}
function expand(t){
 t=t.toLowerCase().replace(/[’‘`]/g,"'");
 t=t.replace(/\bcan't\b/g,'cannot').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not');
 t=t.replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will');
 const pp=/^(already|just|finally|ever|never|been|done|gone|had|held|taken|made|[a-z]+ed)$/;
 t=t.replace(/\b(\w+)'(s|d)\s+(\w+)/g,(m,a,x,w)=>a+' '+(x==='s'?(pp.test(w)?'has':'is'):(pp.test(w)?'had':'would'))+' '+w);
 return t;
}
function checkAnswer(){
 const v=$('studentInput').value.trim();if(!v)return;
 let ok;
 if(currentDirection==='ru-en'){
  const f=t=>expand(t).replace(/[^a-z0-9]/g,'');ok=f(v)===f(currentCard.en);
 }else{
  const f=t=>t.toLowerCase().replace(/ё/g,'е').replace(/[^а-я0-9]/g,'');
  const s=f(v),c=f(currentCard.ru);ok=s===c||(s.length>4&&c.includes(s));
 }
 showAnswer(ok);
}
function showAnswer(ok){
 $('cardBack').className='face back rotate-y-180 '+(ok?'ok':'bad');
 $('cardInner').classList.add('rotate-y-180');
 $('inputZone').classList.add('hidden');
 $('controls').classList.remove('hidden');$('controls').classList.add('flex');
 speakAnswer();
}
let voices=[],chosenVoice='';
const femaleRe=/female|samantha|karen|moira|tessa|serena|victoria|allison|ava|susan|zira|aria|jenny|hazel|libby|sonia|catherine|fiona|kate|zoe/i;
function loadVoices(){
 try{
 if(!('speechSynthesis' in window))return;
 voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
 const sel=$('voiceSelect');if(!sel||!voices.length)return;
 let saved='';try{saved=localStorage.getItem('wardrobe_voice')||''}catch(e){}
 sel.innerHTML=voices.map(v=>'<option value="'+v.name+'">'+v.name+' ('+v.lang+')</option>').join('');
 const pick=voices.find(v=>v.name===saved)||voices.find(v=>femaleRe.test(v.name)&&/en-US/i.test(v.lang))||voices.find(v=>femaleRe.test(v.name))||voices[0];
 if(pick){sel.value=pick.name;chosenVoice=pick.name}
 }catch(e){}
}
function setVoice(n){chosenVoice=n;try{localStorage.setItem('wardrobe_voice',n)}catch(e){}speakAnswer()}
function speakAnswer(){
 try{
 if(!('speechSynthesis' in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(currentCard.en);
 const v=voices.find(x=>x.name===chosenVoice);
 if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';
 u.rate=0.85;speechSynthesis.speak(u);
 }catch(e){}
}
try{if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}}catch(e){}
function rateCard(score){
 let w=userProgress[currentCard.id].weight;
 if(score===1)w=Math.min(w+3,15);
 if(score===5)w=Math.max(w-2,1);
 userProgress[currentCard.id].weight=w;
 save();updateStats();pickNextCard();
}
function updateStats(){
 const total=cardsData.length;
 const learned=Object.values(userProgress).filter(p=>p.weight<=2).length;
 $('statsText').innerText='Изучено ситуаций: '+learned+' / '+total;
 $('progressBar').style.width=(learned/total*100)+'%';
}
function resetProgress(){
 if(confirm('Сбросить прогресс обучения для Базового английского гардероба?')){
  try{localStorage.removeItem('wardrobe_progress')}catch(e){}
  freshProgress();updateStats();pickNextCard();
 }
}
init();

</script>
</body>
</html>
